[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cane"
version = "0.1.0"
description = "Python SDK for the Cane agentic AI platform"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://cane.fyi"
Documentation = "https://cane.fyi/guide"
Repository = "https://github.com/cane-ai/cane-python"
